
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <meta charset="UTF-8">
    <style>
        /* CSS: Khung nền màu xanh */
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .blue-container { 
            background-color: #2196F3; 
            padding: 30px; 
            border-radius: 15px; 
            width: 350px; 
            color: white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .tab-buttons { display: flex; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; padding: 10px; cursor: pointer; border: none; 
            background: #ffffff33; color: white; border-radius: 5px 5px 0 0;
        }
        .tab-btn.active { background: white; color: #2196F3; font-weight: bold; }
        .tab-content { display: none; background: white; color: #333; padding: 20px; border-radius: 0 0 10px 10px; }
        .tab-content.active { display: block; }
        input { width: 90%; padding: 8px; margin: 10px 0; }
    </style>
    <style>
    body {
        /* Nền bảy sắc cầu vồng */
        background: linear-gradient(135deg, #ff0000, #ff9900, #ffff00, #00ff00, #0099ff, #4b0082, #9400d3);
        background-attachment: fixed;
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center; /* Căn giữa màn hình */
        font-family: 'Segoe UI', sans-serif;
    }

    .container { 
        background-color: rgba(255, 255, 255, 0.9); /* Màu trắng hơi trong suốt */
        padding: 30px; 
        border-radius: 20px; 
        width: 350px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .tab-buttons { display: flex; margin-bottom: 20px; }
    .tab-btn { 
        flex: 1; padding: 10px; cursor: pointer; border: none; 
        background: #ddd; color: #333; border-radius: 5px; margin: 0 2px;
    }
    .tab-btn.active { background: #ff007f; color: white; font-weight: bold; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px;}
    button[type="submit"] { background: #ff007f; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; width: 100%;}
</style>
<style>
    /* ... các đoạn CSS khác giữ nguyên ... */

    .tab-buttons { 
        display: flex; 
        margin-bottom: 20px; 
        gap: 10px; /* Tạo khoảng cách giữa các nút */
    }

    .tab-btn { 
        flex: 1; 
        padding: 12px; 
        cursor: pointer; 
        border: none; 
        border-radius: 8px;
        color: white; /* Chữ màu trắng để nổi trên nền màu */
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3); /* Tạo bóng cho chữ */
        
        /* Màu cầu vồng */
        background: linear-gradient(90deg, #ff0000, #ff9900, #ffff00, #00ff00, #0099ff, #4b0082, #9400d3);
        background-size: 200% 200%; /* Chuẩn bị cho hiệu ứng di chuyển nếu cần */
        transition: transform 0.2s, filter 0.2s;
    }

    /* Hiệu ứng khi di chuột vào */
    .tab-btn:hover {
        transform: scale(1.05); /* Phóng to nhẹ khi di chuột */
        filter: brightness(1.2); /* Sáng lên */
    }

    /* Nút đang được chọn */
    .tab-btn.active {
        border: 3px solid white; /* Tạo viền trắng cho nút đang chọn */
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    
</style>
<style>
        /* Khung cơ bản với viền cầu vồng */
.rainbow-box {
    padding: 5px; /* Độ dày của viền cầu vồng */
    background: linear-gradient(45deg, #ff0000, #ff9900, #ffff00, #00ff00, #0099ff, #4b0082, #9400d3);
    background-origin: border-box;
    border-radius: 15px; /* Bo góc cho mượt */
    display: inline-block;
    transition: 0.3s; /* Tạo hiệu ứng mượt mà khi hover */
    cursor: pointer;
}

/* Phần nội dung bên trong */
.content {
    background: white; /* Màu nền bên trong khung */
    padding: 20px;
    border-radius: 10px;
}

/* Hiệu ứng khi rê chuột vào */
.rainbow-box:hover {
    /* Thêm viền trắng vào giữa khung cầu vồng và nội dung */
    box-shadow: inset 0 0 0 5px white; 
    transform: scale(1.02); /* Phóng to nhẹ một chút cho nổi bật */
}
    </style>
</head>
<body>
  
<div class="blue-container">
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="openTab(event, 'FormTab')">Nhập Info</button>
        <button class="tab-btn" onclick="openTab(event, 'AboutTab')">Thông tin</button>
    </div>

    <div id="FormTab" class="tab-content active">
        <form id="infoForm">
            <input type="text" id="name" placeholder="Tên của bạn" required>
            <input type="date" id="birthday" required>
            <button type="submit">Gửi Dữ Liệu</button>
        </form>
    </div>

    <div id="AboutTab" class="tab-content">
        <p>Đây là ứng dụng thu thập ngày sinh của bạn.</p>
        <p>Dữ liệu được lưu an toàn vào Google Sheets!</p>
    </div>
</div>
<div class="content">
        <h1>Đây là trang 2!</h1>
        <p>Chào mừng bạn đã chuyển sang trang này.</p>
        <a href="index.html" class="rainbow-box">Quay lại</a>
    </div>
<script>
    // Hàm chuyển Tab
    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    // Logic gửi dữ liệu cũ
    const form = document.getElementById('infoForm');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwO8ra2rSH24120rnrRACGOJerwsFcTFNccpBMqI2lQFsPP7tHWg-8s14z5d0Mmyt6S6Q/exec";
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const data = { name: document.getElementById('name').value, date: document.getElementById('birthday').value };
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
        .then(() => alert("Đã lưu thành công!"));
    });
</script>

<meta name="theme-color" content="#ff0000">
</body>
</html>
